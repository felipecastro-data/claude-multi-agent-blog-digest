name: Nightly Digest

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run digest pipeline
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: claude -p "Use collector, then use writer-formatter" --dangerously-skip-permissions

      - name: Configure git user
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"

      - name: Commit and push if changed
        run: |
          git add docs/data/articles.json digest/notes.md
          git diff --staged --quiet || git commit -m "Update nightly digest"
          git push
