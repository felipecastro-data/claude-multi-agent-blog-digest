<svg viewBox="0 0 1500 320" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a8a8a"/>
    </marker>
  </defs>

  <!-- Node 1: GitHub Actions trigger (beige/data) -->
  <rect x="20" y="110" width="230" height="100" rx="12" fill="#f0e6d6" stroke="#b8a888" stroke-width="1.5"/>
  <text x="135" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#3a3226">GitHub Actions</text>
  <text x="135" y="172" text-anchor="middle" font-size="13" fill="#5a5040">nightly trigger</text>

  <!-- Arrow 1 -->
  <line x1="250" y1="160" x2="298" y2="160" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 2: collector subagent (blue) -->
  <rect x="300" y="105" width="270" height="110" rx="12" fill="#cfe2ff" stroke="#5b8def" stroke-width="1.5"/>
  <text x="435" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1a3a6b">collector subagent</text>
  <text x="435" y="172" text-anchor="middle" font-size="13" fill="#2c4d80">fetches + condenses</text>
  <text x="435" y="190" text-anchor="middle" font-size="13" fill="#2c4d80">via WebFetch</text>

  <!-- Arrow 2 -->
  <line x1="572" y1="160" x2="620" y2="160" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 3: writer-formatter subagent (purple) -->
  <rect x="622" y="100" width="290" height="120" rx="12" fill="#e3d6fa" stroke="#9b6fd6" stroke-width="1.5"/>
  <text x="767" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#3d1f5c">writer-formatter subagent</text>
  <text x="767" y="172" text-anchor="middle" font-size="13" fill="#5a3680">reorders + verifies</text>
  <text x="767" y="190" text-anchor="middle" font-size="13" fill="#5a3680">before writing</text>

  <!-- Arrow 3 -->
  <line x1="914" y1="160" x2="962" y2="160" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 4: articles.json (beige/data) -->
  <rect x="964" y="105" width="250" height="110" rx="12" fill="#f0e6d6" stroke="#b8a888" stroke-width="1.5"/>
  <text x="1089" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#3a3226">docs/data/articles.json</text>
  <text x="1089" y="172" text-anchor="middle" font-size="13" fill="#5a5040">digest output</text>

  <!-- Arrow 4 -->
  <line x1="1216" y1="160" x2="1264" y2="160" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 5: Static site (beige/data) -->
  <rect x="1266" y="110" width="215" height="100" rx="12" fill="#f0e6d6" stroke="#b8a888" stroke-width="1.5"/>
  <text x="1373" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#3a3226">Static site</text>
  <text x="1373" y="172" text-anchor="middle" font-size="13" fill="#5a5040">on GitHub Pages</text>
</svg>
